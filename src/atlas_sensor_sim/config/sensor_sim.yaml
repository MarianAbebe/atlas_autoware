    namespace: /atlas/sensors
    seed: 42
    lidar_rate_hz: 5.0
    imu_rate_hz: 50.0
    gnss_rate_hz: 5.0
    camera_rate_hz: 10.0
    wheel_rate_hz: 30.0
    lidar_range_m: 12.0
