map_server:
  ros__parameters: {use_sim_time: false, yaml_filename: ""}
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    # Keep Nav2 Humble's default planner ID so its stock behavior tree selects
    # this Ackermann-capable Smac plugin without an implicit fallback.
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.20
      allow_unknown: false
      # Reeds-Shepp preserves the same minimum radius while allowing the
      # explicitly supported bounded reverse maneuvers.
      motion_model_for_search: "REEDS_SHEPP"
      minimum_turning_radius: 2.20
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      allow_reverse_expansion: true
      # Prefer a clearance-preserving detour over the lowest-cost path that
      # merely grazes inflated cells; controller collision projection remains
      # the independent final check.
      cost_penalty: 5.0
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker: {plugin: "nav2_controller::SimpleProgressChecker", required_movement_radius: 0.15, movement_time_allowance: 12.0}
    goal_checker: {plugin: "nav2_controller::SimpleGoalChecker", xy_goal_tolerance: 0.20, yaw_goal_tolerance: 0.25, stateful: true}
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.55
      lookahead_dist: 0.65
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.90
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_rotate_to_heading: false
      allow_reversing: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.20
      regulated_linear_scaling_min_speed: 0.08
      max_angular_accel: 0.6
      use_collision_detection: true
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /atlas_ackermann/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ""
behavior_server:
  ros__parameters:
    # Required only because Humble also instantiates NavigateThroughPoses.
    # The Ackermann NavigateToPose tree above never invokes Spin or BackUp;
    # the adapter rejects zero-speed rotation commands if an external client
    # nevertheless requests one.
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin: {plugin: "nav2_behaviors/Spin"}
    backup: {plugin: "nav2_behaviors/BackUp"}
    wait: {plugin: "nav2_behaviors/Wait"}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.6
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.32
      resolution: 0.10
      track_unknown_space: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer: {plugin: "nav2_costmap_2d::StaticLayer", map_subscribe_transient_local: true}
      # Leave enough cost gradient for a 0.32 m footprint to follow the
      # 2.20 m-radius Smac path without RPP's collision projection cutting a
      # corner into a sensed obstacle.
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", inflation_radius: 0.65, cost_scaling_factor: 3.0}
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Nav2 Humble declares these as integer parameters.
      width: 4
      height: 4
      resolution: 0.10
      robot_radius: 0.32
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer: {plugin: "nav2_costmap_2d::StaticLayer", map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan: {topic: /atlas_ackermann/scan, data_type: "LaserScan", clearing: true, marking: true, obstacle_max_range: 3.5, raytrace_max_range: 4.0, obstacle_min_range: 0.08, raytrace_min_range: 0.08}
      inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", inflation_radius: 0.65, cost_scaling_factor: 3.0}
lifecycle_manager_navigation:
  ros__parameters: {use_sim_time: false, autostart: true, node_names: ["map_server", "planner_server", "controller_server", "behavior_server", "bt_navigator"], bond_timeout: 4.0}
