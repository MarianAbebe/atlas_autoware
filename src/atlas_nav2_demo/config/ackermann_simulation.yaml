ackermann_adapter:
  ros__parameters:
    # Provisional simulation-only values; replace only with measured Atlas data.
    wheelbase_m: 1.20
    steering_limit_rad: 0.50
    steering_rate_limit_radps: 0.60
    speed_limit_mps: 0.80
    minimum_conversion_speed_mps: 0.05
ackermann_simulator:
  ros__parameters:
    wheelbase_m: 1.20
    steering_limit_rad: 0.50
    steering_rate_limit_radps: 0.60
    acceleration_limit_mps2: 0.80
    deceleration_limit_mps2: 1.20
    speed_limit_mps: 0.80
    command_timeout_sec: 0.25
    robot_radius: 0.32
    # Start west of the obstacle, leaving room for physically feasible arcs.
    initial_x_m: -1.0
    initial_y_m: 0.0
